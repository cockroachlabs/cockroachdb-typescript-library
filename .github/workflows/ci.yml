name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck & build
        run: npm run build
      - name: Unit tests (no database)
        run: npm test

  integration:
    name: integration tests (live cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start CockroachDB
        run: |
          # Pinned to a released minor. v25.1 exhibited a defaultdb-visibility
          # quirk in CI (created but not seen by the host connection); v25.2 is
          # the version proven to work with this recipe.
          docker run -d --name crdb -p 26257:26257 \
            cockroachdb/cockroach:latest-v25.2 start-single-node --insecure
          for i in $(seq 1 60); do
            if docker exec crdb ./cockroach sql --insecure -e 'SELECT 1' >/dev/null 2>&1; then
              echo "CockroachDB ready"; break
            fi
            sleep 2
          done
          # defaultdb normally exists, but create it explicitly to avoid a race
          # between SQL becoming available and the database being created.
          docker exec crdb ./cockroach sql --insecure -e 'CREATE DATABASE IF NOT EXISTS defaultdb'
      - name: Build + run example against the cluster
        env:
          CRDB_URL: postgres://root@localhost:26257/defaultdb?sslmode=disable
        run: |
          npm run build
          # start-single-node finalizes defaultdb asynchronously; its descriptor
          # can lag a few seconds after creation. Wait until the database is
          # actually connectable before running the example.
          for i in $(seq 1 30); do
            if docker exec crdb ./cockroach sql --insecure --database=defaultdb -e 'SELECT 1' >/dev/null 2>&1; then
              echo "defaultdb ready"; break
            fi
            echo "waiting for defaultdb..."; sleep 2
          done
          # The demo's follower read uses AS OF SYSTEM TIME now()-5s. On a brand-new
          # cluster defaultdb is younger than that window, so the historical read
          # would hit "database does not exist" at that past timestamp. Wait out the
          # fixed 5s window (plus margin) so the snapshot predates the read.
          sleep 7
          node examples/ideas-board/dist/main.js
